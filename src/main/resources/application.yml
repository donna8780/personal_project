spring:
  datasource:
    url: jdbc:mysql://localhost:3306/personal_project?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    root: info
    com.mediation: debug
    org.mybatis: debug
    org.apache.ibatis: debug

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.mediation.homepage.domain.request.entity
  type-handlers-package: com.mediation.homepage.global.typehandler
